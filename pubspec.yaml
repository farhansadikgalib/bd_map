name: bd_map

screenshots:
  - description: Drill-down map at country level showing all 8 divisions.
    path: screenshots/01-drilldown-divisions.png
  - description: Districts of Dhaka division after one tap, with breadcrumb navigation.
    path: screenshots/02-drilldown-districts.png
  - description: Upazilas of Gazipur district.
    path: screenshots/03-drilldown-upazilas.png
  - description: Unions of Kaliakair upazila, the deepest level.
    path: screenshots/04-drilldown-unions.png

description: Interactive drill-down maps of Bangladesh for Flutter, from division to union, with a geography API and data coloring from JSON or an API. Pure Dart, no assets or dependencies.

homepage: https://v2.farhansadikgalib.com
repository: https://github.com/farhansadikgalib/bd_map
issue_tracker: https://github.com/farhansadikgalib/bd_map/issues

version: 1.1.0

topics:
  - map
  - bangladesh
  - widget
  - geo
  - visualization

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

